payment:
  processing:
    consumer-enabled: true

  result-outbox:
    enabled: true
    interval-ms: 5000
  reconciliation:
     enabled: true
     interval-ms: 60000

server:
  port: 8085

spring:
  application:
    name: payment-processing-service
  datasource:
    url: ${PAYMENT_PROCESSING_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${PAYMENT_PROCESSING_DB_USERNAME:SUPPLIER_PAYMENT_APP}
    password: ${PAYMENT_PROCESSING_DB_PASSWORD:SupplierPayment123}
    driver-class-name: oracle.jdbc.OracleDriver

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: payment-processing-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.ofss.event
        spring.json.value.default.type: com.ofss.event.PaymentApprovedEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  currency: inr
  test-payment-method: pm_card_visa

logging:
  level:
    root: INFO
    com.ofss: INFO
    org.springframework.security: DEBUG
    com.ofss.security: DEBUG
jwt:
   secret-key: ${JWT_SECRET_KEY}